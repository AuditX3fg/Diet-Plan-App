<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" role="img" aria-labelledby="title description">
  <title id="title">Tawazon Balance Point brand board</title>
  <desc id="description">A vector identity board showing the Tawazon logo, app icon, colors, and small-size tests.</desc>
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1600" height="1050" fill="#ECFDF5"/>
  <text x="96" y="110" fill="#059669" font-family="Raleway, Avenir Next, sans-serif" font-size="24" font-weight="700" letter-spacing="8">TAWAZON IDENTITY 03</text>
  <text x="94" y="190" fill="#0F172A" font-family="Lora, Georgia, serif" font-size="76" font-weight="600">Balance, made visible.</text>
  <text x="98" y="240" fill="#64748B" font-family="Raleway, Avenir Next, sans-serif" font-size="25">A modular T, an exact balance point, and a path that resolves into progress.</text>

  <rect x="94" y="304" width="1412" height="450" rx="40" fill="#FFFFFF" filter="url(#soft)"/>
  <g transform="translate(142 348) scale(1.45)">
    <path d="M40 86C40 65 56 52 77 55L116 62V96L76 101C56 103 40 99 40 86Z" fill="#059669"/>
    <path d="M216 86C216 65 200 52 179 55L140 62V96L180 101C200 103 216 99 216 86Z" fill="#10B981"/>
    <path d="M128 99V158C128 184 144 198 162 185L205 143" fill="none" stroke="#0F172A" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="128" cy="78" r="13" fill="#EA580C"/>
  </g>
  <text x="566" y="545" fill="#0F172A" font-family="Lora, Georgia, serif" font-size="150" font-weight="600" letter-spacing="-4">Tawazon</text>
  <text x="576" y="625" fill="#059669" font-family="Raleway, Avenir Next, sans-serif" font-size="30" font-weight="700" letter-spacing="11">BALANCED NUTRITION</text>

  <text x="96" y="840" fill="#0F172A" font-family="Raleway, Avenir Next, sans-serif" font-size="22" font-weight="700">CORE PALETTE</text>
  <g transform="translate(96 875)">
    <circle cx="30" cy="30" r="30" fill="#059669"/><text x="76" y="23" fill="#0F172A" font-family="Raleway, sans-serif" font-size="18" font-weight="700">Emerald</text><text x="76" y="49" fill="#64748B" font-family="Raleway, sans-serif" font-size="16">#059669</text>
    <circle cx="260" cy="30" r="30" fill="#10B981"/><text x="306" y="23" fill="#0F172A" font-family="Raleway, sans-serif" font-size="18" font-weight="700">Fresh</text><text x="306" y="49" fill="#64748B" font-family="Raleway, sans-serif" font-size="16">#10B981</text>
    <circle cx="470" cy="30" r="30" fill="#EA580C"/><text x="516" y="23" fill="#0F172A" font-family="Raleway, sans-serif" font-size="18" font-weight="700">Energy</text><text x="516" y="49" fill="#64748B" font-family="Raleway, sans-serif" font-size="16">#EA580C</text>
    <circle cx="690" cy="30" r="30" fill="#0F172A"/><text x="736" y="23" fill="#0F172A" font-family="Raleway, sans-serif" font-size="18" font-weight="700">Ink</text><text x="736" y="49" fill="#64748B" font-family="Raleway, sans-serif" font-size="16">#0F172A</text>
  </g>

  <text x="1125" y="840" fill="#0F172A" font-family="Raleway, Avenir Next, sans-serif" font-size="22" font-weight="700">SMALL-SIZE TEST</text>
